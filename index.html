<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#00A19C" />
    <meta name="application-name" content="ThothVendas" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ThothVendas" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="ThothVendas — App do Vendedor & Catálogo B2B com operação offline e sincronização automática." />
    <title>ThothVendas — App do Vendedor & Catálogo B2B</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var urlLight = params.get('theme') === 'light' || params.has('light');
        var urlDark = params.get('theme') === 'dark' || params.has('dark');
        var theme = localStorage.getItem('theme');
        if (urlLight) {
          document.documentElement.classList.remove('dark');
        } else if (urlDark || theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] dark:bg-[#090D16] text-slate-900 dark:text-slate-100 antialiased font-sans selection:bg-[#00A19C]/20 selection:text-[#0F766E]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
