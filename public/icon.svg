<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Gradiente oficial da cor do produto -->
    <linearGradient id="bg-grad-thoth-vendas" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    
    <!-- Brilho atmosférico sutil no topo -->
    <radialGradient id="top-glow-thoth-vendas" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    
    <!-- Filtro de sombra suave do mascote -->
    <filter id="icon-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Fundo Squircle (cantos arredondados raio 225px = 22% de 1024) -->
  <rect width="1024" height="1024" rx="225" ry="225" fill="url(#bg-grad-thoth-vendas)" />
  
  <!-- Overlay de brilho sutil -->
  <rect width="1024" height="1024" rx="225" ry="225" fill="url(#top-glow-thoth-vendas)" />
  
  <!-- Borda interna fina de alta definição (estilo Apple/macOS) -->
  <rect width="1022" height="1022" x="1" y="1" rx="224" ry="224" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" />

